# Airbyte ingestion: your source -> raw.* in the destination warehouse.
#
# Source-agnostic. The connection it selects and the asset-key prefix it stamps
# both come from .env (AIRBYTE_CONNECTION_NAME / AIRBYTE_SOURCE_NAME), so the same
# component serves whatever source is installed — `make example-stripe` points it
# at the Stripe connection; your own source sets those two vars instead.
#
# The connection itself is declared in Terraform (ingestion/terraform/, or
# examples/stripe/terraform/connection.tf for the example); this file only makes
# its streams visible to Dagster as assets. Materializing one triggers a sync of
# the whole connection (Airbyte's unit of work is the connection, not the stream).
#
# This is OSS Airbyte running in abctl's kind cluster, not Airbyte Cloud, hence
# the explicit *_base_url pointing at localhost:8000. Credentials come from .env
# via `make airbyte-creds` — Dagster loads .env from the project root on startup.
type: dagster_airbyte.AirbyteWorkspaceComponent

attributes:
  workspace:
    rest_api_base_url: http://localhost:8000/api/public/v1
    configuration_api_base_url: http://localhost:8000/api/v1
    workspace_id: "{{ env.AIRBYTE_WORKSPACE_ID }}"
    client_id: "{{ env.AIRBYTE_CLIENT_ID }}"
    client_secret: "{{ env.AIRBYTE_CLIENT_SECRET }}"

  connection_selector:
    by_name:
      - "{{ env.AIRBYTE_CONNECTION_NAME }}"

  # The asset key MUST match the dbt source key, or the graph silently splits in
  # two: Airbyte assets on one side, dbt models with phantom upstreams on the
  # other. dbt keys a source as [source_name, table_name], so Airbyte's default
  # single-segment key is remapped to match here. AIRBYTE_SOURCE_NAME is the same
  # value used as the dbt source `name` in _<source>__sources.yml — keep them
  # equal. (Empty scaffold: no connection matches the selector, so this component
  # simply contributes zero assets until a source is installed.)
  translation:
    key: "{{ env.AIRBYTE_SOURCE_NAME }}/{{ props.stream_name }}"
    group_name: "raw_{{ env.AIRBYTE_SOURCE_NAME }}"
    # Dagster owns the schedule, not Airbyte. The connection in terraform/ is
    # deliberately `manual` so there is exactly one place a sync can be
    # triggered from — here. Everything downstream is eager, so this cron is
    # the single clock for the whole platform.
    automation_condition: "{{ dg.AutomationCondition.on_cron('0 6 * * *') }}"
