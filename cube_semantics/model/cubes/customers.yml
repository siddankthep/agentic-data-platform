cubes:
  - name: customers
    sql_table: silver_marts.dim_customers
    data_source: default
    title: Customers
    description: >
      One row per Stripe customer, pre-enriched with lifetime billing, payment
      and subscription totals — the entry point for any "who is this customer"
      question. A dimension table: `customer_id` is the grain and the
      lifetime_* columns are computed once in dbt (`marts/stripe/dim_customers.sql`),
      not re-derived here, so this cube and the `subscriptions`/`invoices`/
      `charges` cubes will always agree.

      `email` is personal data — treat it as sensitive in any output that
      leaves this system.

    joins:
      - name: subscriptions
        sql: "{CUBE.customer_id} = {subscriptions.customer_id}"
        relationship: one_to_many

      - name: invoices
        sql: "{CUBE.customer_id} = {invoices.customer_id}"
        relationship: one_to_many

      - name: charges
        sql: "{CUBE.customer_id} = {charges.customer_id}"
        relationship: one_to_many

    dimensions:
      - name: customer_id
        sql: "{CUBE}.customer_id"
        type: string
        primary_key: true
        title: Customer ID
        description: Stripe customer id. The primary key of this cube and the join key from every other cube.

      - name: customer_name
        sql: "{CUBE}.customer_name"
        type: string
        title: Name

      - name: email
        sql: "{CUBE}.email"
        type: string
        title: Email
        description: Personal data. Avoid surfacing this in aggregate reports.

      - name: country
        sql: "{CUBE}.country"
        type: string
        title: Country

      - name: currency
        sql: "{CUBE}.currency"
        type: string
        title: Currency
        description: >
          Customer's billing currency. Everything in this account is `usd`
          today — see the platform docs for what changes if a second currency
          shows up.

      - name: account_balance
        sql: "{CUBE}.account_balance"
        type: number
        title: Account Balance
        description: >
          Stripe customer balance, in Stripe's sign convention: negative means
          Stripe owes the customer a credit (applied to the next invoice),
          positive means the customer owes Stripe outside of any invoice.
          Zero for almost every customer in this dataset.

      - name: is_delinquent
        sql: "{CUBE}.is_delinquent"
        type: boolean
        title: Delinquent
        description: True when Stripe has marked the customer delinquent — a charge or invoice has failed and hasn't been resolved.

      - name: is_active_subscriber
        sql: "{CUBE}.is_active_subscriber"
        type: boolean
        title: Active Subscriber
        description: True when the customer has at least one subscription in `active` or `trialing` status right now. A point-in-time flag, computed at dbt build time.

      - name: created_at
        sql: "{CUBE}.created_at"
        type: time
        title: Customer Since

      - name: first_subscription_started_at
        sql: "{CUBE}.first_subscription_started_at"
        type: time
        title: First Subscription Started
        description: Null for customers who never subscribed (charge-only or trial-abandoned customers).

    measures:
      - name: count
        type: count
        title: Customers
        description: Number of customers. Safe at any grain — this is a true dimension table, one row per customer, no fan-out risk.

      - name: active_subscribers
        type: count
        filters:
          - sql: "{CUBE}.is_active_subscriber"
        title: Active Subscribers
        description: Customers with at least one active or trialing subscription right now.

      - name: active_subscriber_rate
        type: number
        sql: "1.0 * {CUBE.active_subscribers} / NULLIF({CUBE.count}, 0)"
        format: percent
        title: Active Subscriber Rate
        description: Share of customers in the slice who are currently active subscribers.

      - name: delinquent_customers
        type: count
        filters:
          - sql: "{CUBE}.is_delinquent"
        title: Delinquent Customers

      - name: lifetime_value_sum
        type: sum
        sql: "{CUBE}.lifetime_value"
        title: Total Lifetime Value
        format: currency
        description: >
          Sum of `amount_captured` across all succeeded charges — gross
          revenue collected, before refunds. Defined once in
          `dim_customers.sql`; do not recompute from `charges`.

      - name: lifetime_refunded_sum
        type: sum
        sql: "{CUBE}.lifetime_refunded"
        title: Total Lifetime Refunded
        format: currency

      - name: net_lifetime_value_sum
        type: number
        sql: "{CUBE.lifetime_value_sum} - {CUBE.lifetime_refunded_sum}"
        title: Net Lifetime Value
        format: currency
        description: Gross lifetime value minus lifetime refunds. Tracked separately upstream so you can choose gross or net depending on the question.

      - name: avg_lifetime_value
        type: number
        sql: "{CUBE.lifetime_value_sum} / NULLIF({CUBE.count}, 0)"
        format: currency
        title: Avg Lifetime Value

      - name: lifetime_billed_sum
        type: sum
        sql: "{CUBE}.lifetime_billed"
        title: Total Lifetime Billed
        format: currency
        description: >
          Sum of `amount_paid` across paid invoices. Differs from
          `lifetime_value_sum` when charges happen outside the invoicing flow
          (e.g. one-off PaymentIntents).

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
