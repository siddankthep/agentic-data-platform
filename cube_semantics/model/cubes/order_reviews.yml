cubes:
  - name: order_reviews
    data_source: default
    title: Order Reviews
    description: >
      Customer satisfaction ratings, one row per order. Reviews are collected by
      a post-delivery survey, so a review score is primarily a verdict on the
      delivery experience — pairing review measures with the delivery measures
      on `orders` is the intended use of this cube.

      Deduplication: the source table has no primary key and can hold several
      rows per order (and the same review_id against several orders). The SQL
      below keeps only the most recently answered review per order, which makes
      order_id a genuine key and stops review counts from being inflated.

    sql: >
      SELECT DISTINCT ON (order_id)
        order_id,
        review_id,
        review_score,
        review_comment_title,
        review_creation_date,
        review_answer_timestamp
      FROM public.order_reviews
      ORDER BY order_id, review_answer_timestamp DESC

    dimensions:
      - name: order_id
        sql: "{CUBE}.order_id"
        type: string
        primary_key: true
        title: Order ID
        description: The reviewed order. One review per order after deduplication.

      - name: review_score
        sql: "{CUBE}.review_score"
        type: number
        title: Review Score
        description: >
          Customer rating from 1 (worst) to 5 (best). Group by it to see the
          score distribution; aggregate it with `avg_review_score`.

      - name: review_sentiment
        sql: >
          CASE
            WHEN {CUBE}.review_score >= 4 THEN 'positive'
            WHEN {CUBE}.review_score = 3 THEN 'neutral'
            ELSE 'negative'
          END
        type: string
        title: Review Sentiment
        description: >
          Score bucketed into positive (4–5), neutral (3) and negative (1–2).
          Use this rather than inventing ad-hoc score thresholds, so sentiment
          means the same thing in every report.

      - name: has_comment
        sql: "{CUBE}.review_comment_title IS NOT NULL"
        type: boolean
        title: Has Written Comment
        description: >
          True when the customer left a comment title, not just a star rating.
          Roughly a proxy for how strongly the customer felt.

      - name: review_creation_date
        sql: "{CUBE}.review_creation_date"
        type: time
        title: Survey Sent Date
        description: When the satisfaction survey was sent to the customer.

      - name: review_answer_timestamp
        sql: "{CUBE}.review_answer_timestamp"
        type: time
        title: Review Answered At
        description: >
          When the customer submitted the review. Use this as the time dimension
          for review trends; use `orders.order_purchase_timestamp` instead when
          comparing against order cohorts.

      - name: review_response_days
        sql: >
          EXTRACT(EPOCH FROM ({CUBE}.review_answer_timestamp
            - {CUBE}.review_creation_date)) / 86400.0
        type: number
        title: Response Days
        description: >
          Days between the survey being sent and the customer answering it.
          Measures survey responsiveness, not delivery speed — do not confuse it
          with `orders.delivery_days`.

    measures:
      - name: num_reviews
        type: count
        title: Reviews
        description: >
          Number of reviews (one per order after deduplication). Inflated if the
          query also includes item-level or payment-level members — prefer
          `reviewed_orders` in mixed-grain queries.

      - name: reviewed_orders
        type: count_distinct
        sql: "{CUBE}.order_id"
        title: Reviewed Orders
        description: Distinct orders carrying a review. Fan-out safe.

      # -- Additive building blocks --------------------------------------
      # Private helpers that keep the averages and rates below additive, so
      # pre-aggregations can store them per day and still answer monthly
      # questions. See the pre_aggregations block.
      - name: review_score_sum
        type: sum
        sql: "{CUBE}.review_score"
        public: false

      - name: scored_reviews
        type: count
        public: false
        filters:
          - sql: "{CUBE}.review_score IS NOT NULL"

      - name: response_days_sum
        type: sum
        sql: "{CUBE.review_response_days}"
        public: false

      - name: avg_review_score
        type: number
        sql: "{CUBE.review_score_sum} / NULLIF({CUBE.scored_reviews}, 0)"
        title: Avg Review Score
        description: >
          Mean star rating, 1–5. The headline satisfaction metric. Expressed as
          sum ÷ count rather than a plain AVG so pre-aggregations can serve it
          at any granularity.

          Caution: alongside item-level members this becomes an item-weighted
          average — a five-item order contributes its score five times. For a
          strict per-order figure, query it without item members.

      - name: promoters
        type: count
        filters:
          - sql: "{CUBE}.review_score >= 4"
        title: Positive Reviews
        description: >
          Reviews rated 4 or 5. One row per order at review grain, so this
          equals an order count unless the query also carries item-level
          members, in which case it is item-weighted like the rest of this cube.

      - name: detractors
        type: count
        filters:
          - sql: "{CUBE}.review_score <= 2"
        title: Negative Reviews
        description: Reviews rated 1 or 2. Same weighting note as `promoters`.

      - name: one_star_reviews
        type: count
        filters:
          - sql: "{CUBE}.review_score = 1"
        title: One-Star Reviews
        description: >
          Reviews rated 1 — the sharpest dissatisfaction signal, and the one
          that correlates most strongly with late delivery.

      - name: positive_review_rate
        type: number
        sql: "1.0 * {CUBE.promoters} / NULLIF({CUBE.scored_reviews}, 0)"
        format: percent
        title: Positive Review Rate
        description: Share of scored reviews rated 4 or 5. Ranges 0–1.

      - name: negative_review_rate
        type: number
        sql: "1.0 * {CUBE.detractors} / NULLIF({CUBE.scored_reviews}, 0)"
        format: percent
        title: Negative Review Rate
        description: >
          Share of scored reviews rated 1 or 2. The primary quality-alarm
          metric — segment it by seller or category to find problem areas.

      - name: nps_like_score
        type: number
        sql: >
          100.0 * ({CUBE.promoters} - {CUBE.detractors})
            / NULLIF({CUBE.scored_reviews}, 0)
        title: NPS-Like Score
        description: >
          Positive-review share minus negative-review share, scaled to −100…100.
          NPS-shaped but NOT true NPS: it is derived from a 1–5 star rating, not
          from an 0–10 recommendation question. Label it as such in any output.

      - name: avg_review_response_days
        type: number
        sql: "{CUBE.response_days_sum} / NULLIF({CUBE.num_reviews}, 0)"
        title: Avg Response Days
        description: Mean days customers take to answer the satisfaction survey.

    pre_aggregations:
      # Note the refresh_key here: this cube's `sql` is a DISTINCT ON query, so
      # Cube cannot infer a cheap freshness check for it. An explicit key on
      # MAX(review_answer_timestamp) means the rollup is only rebuilt when a
      # genuinely newer review lands, rather than on a blind timer.

      # Satisfaction by score and sentiment over time. Tiny — five score values
      # by three sentiment buckets — and it answers most review questions.
      - name: reviews_by_day_score
        measures:
          - num_reviews
          - scored_reviews
          - review_score_sum
          - response_days_sum
          - promoters
          - detractors
          - one_star_reviews
        dimensions:
          - review_score
          - review_sentiment
        time_dimension: review_answer_timestamp
        granularity: day
        partition_granularity: month
        refresh_key:
          sql: "SELECT MAX(review_answer_timestamp) FROM public.order_reviews"

      # Satisfaction joined to delivery outcome — the rollup behind "do late
      # deliveries get worse reviews?". Grouping by orders.is_late and
      # order_status keeps it two-dimensional and small.
      - name: reviews_by_month_delivery_outcome
        measures:
          - num_reviews
          - scored_reviews
          - review_score_sum
          - promoters
          - detractors
          - one_star_reviews
        dimensions:
          - orders.is_late
          - orders.order_status
        time_dimension: orders.order_purchase_timestamp
        granularity: month
        refresh_key:
          sql: "SELECT MAX(review_answer_timestamp) FROM public.order_reviews"
