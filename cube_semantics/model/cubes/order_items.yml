cubes:
  - name: order_items
    sql_table: public.order_items
    data_source: default
    title: Order Items
    description: >
      One row per product line within an order — the finest grain in the model,
      and the only place product- and seller-level revenue can be measured. An
      order with three items produces three rows here.

      Grain warning: this cube fans out `orders`. Any query mixing item measures
      with order measures must use the fan-out-safe order measures
      (`orders.distinct_orders`, `orders.delivered_orders`), and any average
      pulled from `orders` or `order_reviews` becomes item-weighted.

      Revenue note: `total_price` is merchandise value only. Customer-paid
      totals live in `order_payments.total_payment_value` and will differ —
      freight, vouchers and instalment fees are handled separately.

    joins:
      - name: orders
        sql: "{CUBE.order_id} = {orders.order_id}"
        relationship: many_to_one

      - name: products
        sql: "{CUBE.product_id} = {products.product_id}"
        relationship: many_to_one

      - name: sellers
        sql: "{CUBE.seller_id} = {sellers.seller_id}"
        relationship: many_to_one

    dimensions:
      - name: order_id
        sql: "{CUBE}.order_id"
        type: string
        primary_key: true
        public: true
        title: Order ID
        description: >
          The parent order. Part of the composite key (order_id,
          order_item_id).

      - name: order_item_id
        sql: "{CUBE}.order_item_id"
        type: number
        primary_key: true
        public: true
        title: Item Sequence
        description: >
          Position of the line within its order, starting at 1. Not a product
          identifier — it is only unique within an order, and its maximum value
          per order is that order's item count.

      - name: product_id
        sql: "{CUBE}.product_id"
        type: string
        title: Product ID
        description: The product sold on this line. Join key to the `products` cube.

      - name: seller_id
        sql: "{CUBE}.seller_id"
        type: string
        title: Seller ID
        description: >
          The seller fulfilling this line. Items in one order can come from
          different sellers, which is why seller analysis must happen at item
          grain.

      - name: shipping_limit_date
        sql: "{CUBE}.shipping_limit_date"
        type: time
        title: Shipping Deadline
        description: >
          Contractual deadline for the seller to hand this item to the carrier.
          Compare against `orders.order_delivered_carrier_date` to judge seller
          punctuality — that comparison is `is_shipped_late`.

      - name: price
        sql: "{CUBE}.price"
        type: number
        title: Item Price
        description: >
          Merchandise price of this single line, excluding freight, in BRL.
          Aggregate with `total_price`; do not sum it in a downstream tool.

      - name: freight_value
        sql: "{CUBE}.freight_value"
        type: number
        title: Item Freight
        description: >
          Shipping cost allocated to this line, in BRL. Orders with several
          items split freight across lines.

      - name: is_shipped_late
        sql: >
          {orders.order_delivered_carrier_date} > {CUBE}.shipping_limit_date
        type: boolean
        title: Shipped Late
        description: >
          True when the seller missed the shipping deadline for this item. Null
          until the item is handed to the carrier. The cleanest attribution of
          a delay to the seller rather than the carrier.

    measures:
      - name: count
        type: count
        title: Items Sold
        description: >
          Number of item lines — i.e. unit volume, since each line is one unit.
          This is a genuine item-grain count and is always safe here.

      - name: distinct_orders_with_items
        type: count_distinct
        sql: "{CUBE}.order_id"
        title: Orders with Items
        description: >
          Distinct orders represented in the slice. Use it as the denominator
          when converting item measures back to a per-order basis.

      - name: distinct_products
        type: count_distinct
        sql: "{CUBE}.product_id"
        title: Distinct Products
        description: Number of unique products sold in the slice — assortment breadth.

      - name: distinct_sellers
        type: count_distinct
        sql: "{CUBE}.seller_id"
        title: Distinct Sellers
        description: Number of unique sellers active in the slice.

      - name: total_price
        type: sum
        sql: "{CUBE}.price"
        title: Merchandise Revenue
        description: >
          Sum of item prices in BRL, excluding freight. The canonical revenue
          measure for product, category and seller analysis. Not the same as
          what the customer paid — see `order_payments.total_payment_value`.

      - name: avg_price
        type: number
        sql: "{CUBE.total_price} / NULLIF({CUBE.count}, 0)"
        title: Avg Item Price
        description: >
          Mean price per item line — the average selling price, not average
          order value. Expressed as sum ÷ count so pre-aggregations can serve
          it; an average of averages would be wrong.

      - name: total_freight_value
        type: sum
        sql: "{CUBE}.freight_value"
        title: Total Freight
        description: Sum of allocated shipping costs in BRL.

      - name: avg_freight_value
        type: number
        sql: "{CUBE.total_freight_value} / NULLIF({CUBE.count}, 0)"
        title: Avg Item Freight
        description: Mean shipping cost per item line.

      - name: freight_ratio
        type: number
        sql: "1.0 * {CUBE.total_freight_value} / NULLIF({CUBE.total_price}, 0)"
        format: percent
        title: Freight Ratio
        description: >
          Freight as a share of merchandise revenue. High values flag heavy or
          badly located products whose economics are marginal.

      - name: avg_items_per_order
        type: number
        sql: "1.0 * {CUBE.count} / NULLIF({CUBE.distinct_orders_with_items}, 0)"
        title: Avg Items per Order
        description: >
          Basket size in units. Also the factor by which order-level averages
          get inflated when queried at item grain — useful for sanity checks.

      - name: late_shipped_items
        type: count
        filters:
          - sql: "{orders.order_delivered_carrier_date} > {CUBE}.shipping_limit_date"
        title: Late Shipped Items
        description: Item lines the seller handed to the carrier after the deadline.

      - name: late_shipment_rate
        type: number
        sql: "1.0 * {CUBE.late_shipped_items} / NULLIF({CUBE.count}, 0)"
        format: percent
        title: Late Shipment Rate
        description: >
          Share of item lines shipped after their deadline. The seller-side
          reliability metric — distinct from `orders.late_delivery_rate`, which
          also includes carrier delay.

    pre_aggregations:
      # All measures here are sums and counts, so every rollup below is fully
      # additive and re-usable across granularities. The count_distinct measures
      # (distinct_products, distinct_sellers, distinct_orders_with_items) are
      # deliberately excluded — including one would make the whole rollup
      # non-additive and it could then only answer queries at exactly its own
      # granularity.
      #
      # The time dimension comes from the joined orders cube. Items have no
      # meaningful date of their own, and every trend question is asked in terms
      # of when the order was placed.

      # Category and geography — the assortment view. Low cardinality
      # (~70 categories × 27 states), so this stays small even at day grain.
      - name: items_by_day_category_state
        measures:
          - count
          - total_price
          - total_freight_value
          - late_shipped_items
        dimensions:
          - products.category_english
          - sellers.seller_state
        time_dimension: orders.order_purchase_timestamp
        granularity: day
        partition_granularity: month
        refresh_key:
          every: 1 hour

      # Per-seller scorecard. ~3k sellers makes this the highest-cardinality
      # rollup in the model, so it is built at MONTH grain on purpose — at day
      # grain it would approach the size of the source table and stop being a
      # saving. Seller ranking is a monthly question anyway.
      - name: items_by_month_seller
        measures:
          - count
          - total_price
          - total_freight_value
          - late_shipped_items
        dimensions:
          - sellers.seller_id
          - sellers.seller_state
        time_dimension: orders.order_purchase_timestamp
        granularity: month
        refresh_key:
          every: 1 hour
