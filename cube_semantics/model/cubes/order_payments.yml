cubes:
  - name: order_payments
    sql_table: public.order_payments
    data_source: default
    title: Order Payments
    description: >
      One row per payment record on an order. An order can be settled by several
      records — split across a voucher plus a card, for example — so this cube
      fans out `orders` exactly as `order_items` does.

      Use this cube for what the customer actually paid and how. Use
      `order_items.total_price` for merchandise revenue. The two will not match:
      payment value includes freight and instalment effects, and voucher rows
      split a single order across several records.

    joins:
      - name: orders
        sql: "{CUBE.order_id} = {orders.order_id}"
        relationship: many_to_one

    dimensions:
      - name: order_id
        sql: "{CUBE}.order_id"
        type: string
        primary_key: true
        title: Order ID
        description: The order being paid for. Part of the composite key with `payment_sequential`.

      - name: payment_sequential
        sql: "{CUBE}.payment_sequential"
        type: number
        primary_key: true
        title: Payment Sequence
        description: >
          Position of this payment record within its order, starting at 1.
          Values above 1 mean the order was settled by more than one method.

      - name: payment_type
        sql: "{CUBE}.payment_type"
        type: string
        title: Payment Method
        description: >
          How this portion was paid: credit_card, boleto, voucher, debit_card,
          or not_defined. `boleto` is a Brazilian bank slip — cash-like, paid
          later, and associated with slower order approval.

      - name: payment_installments
        sql: "{CUBE}.payment_installments"
        type: number
        title: Instalments
        description: >
          Number of instalments the customer chose. 1 means paid in full. Only
          meaningful for credit_card payments; other methods report 1 or 0.

      - name: payment_value
        sql: "{CUBE}.payment_value"
        type: number
        title: Payment Amount
        description: >
          Amount settled by this single record, in BRL. Aggregate with
          `total_payment_value`.

      - name: is_installment_purchase
        sql: "{CUBE}.payment_installments > 1"
        type: boolean
        title: Paid in Instalments
        description: True when the customer split this payment over more than one instalment.

    measures:
      - name: num_payments
        type: count
        title: Payment Records
        description: >
          Number of payment records, not number of orders paid. Use
          `distinct_orders_paid` for an order count.

      - name: distinct_orders_paid
        type: count_distinct
        sql: "{CUBE}.order_id"
        title: Orders Paid
        description: Distinct orders with at least one payment record. Fan-out safe.

      - name: total_payment_value
        type: sum
        sql: "{CUBE}.payment_value"
        title: Total Paid
        description: >
          Total amount customers paid, in BRL, including freight. The
          cash-collected view of revenue. Compare with
          `order_items.total_price` for the merchandise-only view.

      - name: avg_payment_value
        type: avg
        sql: "{CUBE}.payment_value"
        title: Avg Payment Amount
        description: >
          Mean value per payment RECORD, not per order. For average order value,
          divide `total_payment_value` by `distinct_orders_paid` —
          `avg_order_value` does this for you.

      - name: avg_order_value
        type: number
        sql: "1.0 * {CUBE.total_payment_value} / NULLIF({CUBE.distinct_orders_paid}, 0)"
        title: Avg Order Value
        description: >
          Total paid divided by distinct orders — the correct AOV, unaffected by
          orders being split across several payment records.

      - name: avg_installments
        type: avg
        sql: "{CUBE}.payment_installments"
        title: Avg Instalments
        description: >
          Mean instalment count across payment records. Filter to
          `payment_type = 'credit_card'` for a meaningful reading.

      - name: installment_share
        type: number
        sql: >
          1.0 * {CUBE.installment_payments} / NULLIF({CUBE.num_payments}, 0)
        format: percent
        title: Instalment Share
        description: Share of payment records split over more than one instalment.

      - name: installment_payments
        type: count
        filters:
          - sql: "{CUBE}.payment_installments > 1"
        title: Instalment Payments
        description: Payment records with more than one instalment.

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
