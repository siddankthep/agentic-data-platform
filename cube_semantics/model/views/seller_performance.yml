views:
  - name: seller_performance
    title: Seller Performance
    description: >
      Seller-facing scorecard: how much each merchant sells, how reliably they
      ship, and how satisfied their customers are. Built for marketplace
      operations — seller ranking, onboarding review, and root-causing bad
      delivery experiences.

      GRAIN: item level. The root is `order_items`, because a single order can
      contain items from several sellers, so seller economics only exist at item
      grain. Consequences you must respect when reading results:

        * Revenue, units and shipping punctuality are exact — they are native to
          item grain.
        * Order counts are exact, because every order measure exposed here is a
          distinct count (`orders`, `delivered_orders`).
        * The averages carried over from the order and review cubes
          (`avg_delivery_days`, `avg_review_score`, `on_time_delivery_rate`) are
          ITEM-WEIGHTED: a five-item order contributes five times. For this view
          that is the intended reading — "the experience attached to an item this
          seller sold" — but it will not tie out exactly against the same measure
          queried per order in `order_economics`. Say so when reporting both.

      Attribution: `late_shipment_rate` is the seller's own fault (missed the
      handover deadline), while `late_delivery_rate` also absorbs carrier delay.
      Compare the two before blaming a seller for slow delivery.

    cubes:
      # -- Who: the seller and their location --------------------------
      - join_path: order_items.sellers
        includes:
          - seller_id
          - seller_city
          - seller_state

      # -- What they sell ----------------------------------------------
      - join_path: order_items.products
        prefix: true
        includes:
          - category_english
          - size_class
          - avg_product_weight

      # -- Commercial performance --------------------------------------
      - join_path: order_items
        includes:
          - count
          - total_price
          - avg_price
          - total_freight_value
          - avg_freight_value
          - freight_ratio
          - distinct_products
          - distinct_orders_with_items
          # seller-controlled shipping punctuality
          - late_shipped_items
          - late_shipment_rate
          - shipping_limit_date

      # -- Fulfilment experience (order grain, item-weighted) -----------
      - join_path: order_items.orders
        prefix: true
        includes:
          - order_purchase_timestamp
          - order_status
          - distinct_orders
          - delivered_orders
          - avg_delivery_days
          - median_delivery_days
          - avg_seller_handling_days
          - avg_carrier_transit_days
          - on_time_delivery_rate
          - late_delivery_rate

      # -- Customer satisfaction (order grain, item-weighted) -----------
      - join_path: order_items.orders.order_reviews
        prefix: true
        includes:
          - avg_review_score
          - reviewed_orders
          - negative_review_rate
          - one_star_reviews
          - nps_like_score

      # -- Where the customer is (delivery distance driver) -------------
      - join_path: order_items.orders.customers
        prefix: true
        includes:
          - customer_state
