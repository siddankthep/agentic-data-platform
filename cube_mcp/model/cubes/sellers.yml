cubes:
  - name: sellers
    sql_table: public.sellers
    data_source: default

    joins: []

    dimensions:
      - name: seller_id
        sql: seller_id
        type: string
        primary_key: true

      - name: seller_city
        sql: seller_city
        type: string

      - name: seller_state
        sql: seller_state
        type: string

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
