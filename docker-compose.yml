services:
  cube:
    image: cubejs/cube:latest
    # Cube writes generated models and Cube Store state into the bind mount
    # below. Without this it runs as root and those files land on the host as
    # root:root, uneditable by the developer. Makefile exports the host's ids.
    user: ${DOCKER_UID:-1000}:${DOCKER_GID:-1000}
    ports:
      - 4000:4000
      - 15432:15432
    environment:
      - CUBEJS_DEV_MODE=true
      - CUBEJS_SCHEMA_PATH=model
      - CUBEJS_DB_TYPE=postgres
      - CUBEJS_DB_HOST=postgres
      - CUBEJS_DB_PORT=5432
      - CUBEJS_DB_NAME=${POSTGRES_DB:-ecom}
      - CUBEJS_DB_USER=${POSTGRES_USER:-cube}
      - CUBEJS_DB_PASS=${POSTGRES_PASSWORD:-cube}
    volumes:
      - ./cube_semantics:/cube/conf
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cube}
      POSTGRES_DB: ${POSTGRES_DB:-ecom}
    ports:
      - ${POSTGRES_PORT:-5435}:5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-cube} -d ${POSTGRES_DB:-ecom}
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
