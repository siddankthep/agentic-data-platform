cubes:
  - name: products
    sql_table: silver_marts.dim_products
    data_source: default
    title: Products
    description: >
      The Stripe product catalogue — one row per product, joined to its
      default price. A dimension table with no sales figures of its own; pair
      it with `subscriptions` or `invoice_line_items` for revenue by product.

      `monthly_price` normalizes the default price to a monthly cadence
      regardless of its actual billing interval (day/week/month/year), the
      same normalization `subscriptions.mrr` uses — the two are comparable.

    joins: []

    dimensions:
      - name: product_id
        sql: "{CUBE}.product_id"
        type: string
        primary_key: true
        title: Product ID

      - name: product_name
        sql: "{CUBE}.product_name"
        type: string
        title: Product Name

      - name: product_description
        sql: "{CUBE}.product_description"
        type: string
        title: Description

      - name: product_is_active
        sql: "{CUBE}.product_is_active"
        type: boolean
        title: Active
        description: Whether the product is still active in Stripe (can be attached to new prices/subscriptions).

      - name: default_price_id
        sql: "{CUBE}.default_price_id"
        type: string
        title: Default Price ID

      - name: currency
        sql: "{CUBE}.currency"
        type: string
        title: Currency

      - name: price_amount
        sql: "{CUBE}.price_amount"
        type: number
        title: Default Price (as billed)
        description: The default price's raw amount, in its own billing interval — not normalized. Use `monthly_price` to compare across products with different intervals.

      - name: billing_interval
        sql: "{CUBE}.billing_interval"
        type: string
        title: Billing Interval
        description: day, week, month or year — the cadence of the default price.

      - name: billing_interval_count
        sql: "{CUBE}.billing_interval_count"
        type: number
        title: Billing Interval Count
        description: Number of intervals between charges, e.g. 3 with interval=month means quarterly.

      - name: monthly_price
        sql: "{CUBE}.monthly_price"
        type: number
        title: Monthly Price
        description: Default price normalized to a monthly figure. The comparable price dimension — prefer this over `price_amount` for any cross-product comparison.

      - name: created_at
        sql: "{CUBE}.created_at"
        type: time
        title: Created At

    measures:
      - name: count
        type: count
        title: Products
        description: Number of products in the catalogue. Counts listings, not sales.

      - name: active_products
        type: count
        filters:
          - sql: "{CUBE}.product_is_active"
        title: Active Products

      - name: avg_monthly_price
        type: avg
        sql: "{CUBE}.monthly_price"
        title: Avg Monthly Price
        format: currency

      - name: min_monthly_price
        type: min
        sql: "{CUBE}.monthly_price"
        title: Min Monthly Price
        format: currency

      - name: max_monthly_price
        type: max
        sql: "{CUBE}.monthly_price"
        title: Max Monthly Price
        format: currency

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
